<h1>Streaming Show — Episode 7</h1>
<div id="player">A script-built player: the media URL never appears in the HTML.</div>
<script>
  // what an HLS player does: master playlist, then a variant playlist, then segments
  (async () => {
    await fetch('/media/stream/master.m3u8');
    await fetch('/media/stream/v720/index.m3u8');
    await fetch('/media/stream/v720/seg-1.ts');
    await fetch('/media/stream/v720/seg-2.ts');
  })();
</script>
